<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAQ & Instructions - Kaun Banega Dharm Shiromani</title>
  <style>
    body {
      background-color: #032b43;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: #0f172a;
      border: 1px solid #38bdf8;
      border-radius: 12px;
      max-width: 800px;
      width: 100%;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      color: #38bdf8;
      text-align: center;
      margin-top: 0;
      font-size: 20px;
    }
    .lang-selector {
      text-align: center;
      margin-bottom: 25px;
      background: #1e293b;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .lang-selector label {
      margin: 0 15px;
      cursor: pointer;
      font-weight: bold;
      color: #f8fafc;
    }
    .lang-selector input {
      margin-right: 5px;
      accent-color: #38bdf8;
    }
    h2 {
      color: #facc15;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
      margin-top: 25px;
      font-size: 15px;
    }
    p, li {
      font-size: 13px;
      line-height: 1.6;
      color: #cbd5e1;
    }
    ul {
      padding-left: 20px;
    }
    .faq-item {
      margin-bottom: 20px;
      background: #1e293b;
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #38bdf8;
      font-size: 13px;
    }
    .faq-question {
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 5px;
    }
    .back-btn-container {
      text-align: center;
      margin-top: 30px;
    }
    .back-btn {
      background: #38bdf8;
      color: #032b43;
      border: none;
      padding: 10px 25px;
      font-weight: bold;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background 0.2s;
    }
    .back-btn:hover {
      background: #0ea5e9;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Using an object tag -->
    <div class="h1">
      <object type="image/svg+xml" data="src/kbds_logo.svg" width="60" height="60"></object>
      <div class="h1">
        <span>Kaun Banega Dharm Shiromani - FAQ & Instructions</span>
      </div>
    </div>  
    <!-- Language Toggle Radio Buttons -->
    <div class="lang-selector">
      <label>
        <input type="radio" name="lang" value="en" checked onclick="renderContent('en')"> English
      </label>
      <label>
        <input type="radio" name="lang" value="hi" onclick="renderContent('hi')"> हिंदी (Hindi)
      </label>
    </div>

    <!-- DYNAMIC CONTENT CONTAINER -->
    <div id="dynamic-content">
      <!-- Injected via JavaScript -->
    </div>

    <!-- Back Button -->
    <div class="back-btn-container">
      <button class="back-btn" onclick="window.close()">Close / बंद करें</button>
    </div>
  </div>

  <!-- Load the external FAQ data file -->
  <script src="src/faq-data.js"></script>
  
  <script>
    function renderContent(lang) {
      const data = window.faqData[lang];
      if (!data) return;

      let html = `
        <h2>${data.howToPlayTitle}</h2>
        <p>${data.howToPlayText}</p>
        
        <h2>${data.lifelinesTitle}</h2>
        <ul>
          ${data.lifelines.map(item => `<li>${item}</li>`).join('')}
        </ul>

        <h2>${data.faqsTitle}</h2>
      `;

      data.items.forEach(faq => {
        html += `
          <div class="faq-item">
            <div class="faq-question">${faq.q}</div>
            <div class="faq-answer">${faq.a}</div>
          </div>
        `;
      });

      document.getElementById('dynamic-content').innerHTML = html;
    }

    // Render English by default when page loads
    window.addEventListener('DOMContentLoaded', () => {
      renderContent('en');
    });
  </script>

</body>
</html>
