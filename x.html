<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kaun Banega Dharm Shiromani | कौन बनेगा धर्म शिरोमणि</title>
  
  <!-- External Libraries: SheetJS for Excel handling & CryptoJS for AES Decryption -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    body {
      background: radial-gradient(circle at center, #1b023a 0%, #080014 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
    }

    /* Setup / Modal Overlay */
    .setup-modal {
      display: flex;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(8, 0, 20, 0.95);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }

    .setup-card {
      background: #180533;
      border: 2px solid #d4af37;
      padding: 25px 20px;
      border-radius: 16px;
      text-align: center;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
    }

    .setup-card h1 {
      color: #ffd700;
      font-size: 1.4rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .setup-card h2 {
      color: #fef08a;
      font-size: 1.2rem;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .status-msg {
      font-size: 0.9rem;
      color: #eab308;
      margin: 15px 0;
      font-weight: 500;
    }

    .form-group {
      margin: 15px 0;
      text-align: left;
      background: #0b0118;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #38bdf8;
    }

    .form-group label.title {
      display: block;
      font-size: 0.95rem;
      color: #ffd700;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .radio-group {
      display: flex;
      gap: 20px;
      margin-bottom: 10px;
    }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      color: #ffffff;
    }

    .timer-input-group {
      display: none;
      flex-direction: row;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .timer-input-group input {
      width: 80px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ffd700;
      background: #180533;
      color: #fff;
      text-align: center;
      font-size: 1rem;
      font-weight: bold;
    }

    .start-btn {
      background: linear-gradient(180deg, #ffd700 0%, #b8860b 100%);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
    }

    .start-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .instructions-btn {
      background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.3);
    }

    .thanks-btn {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    /* Main App Layout */
    #app-container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 100%;
      max-width: 800px;
      height: 98vh;
      margin: 0 auto;
      padding: 8px;
      position: relative;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(30, 10, 60, 0.8);
      border: 2px solid #d4af37;
      border-radius: 12px;
      padding: 8px 16px;
    }

    .title-banner {
      display: flex;
      flex-direction: column;
    }

    .title-en {
      font-weight: bold;
      color: #ffd700;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .title-hi {
      font-weight: 600;
      color: #fef08a;
      font-size: 0.85rem;
    }

    .meta-badges {
      display: flex;
      gap: 8px;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.70rem;
      font-weight: 700;
      text-transform: uppercase;
      border: 1px solid #ffd700;
    }

    .badge-level { background: #3b82f6; color: #fff; }

    .lifelines-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 8px 0;
      flex-wrap: wrap;
    }

    .lifeline-btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1.5px solid #ffd700;
      background: radial-gradient(circle, #3a0066 0%, #110022 100%);
      color: #ffd700;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lifeline-btn:hover:not(.used) {
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
      transform: translateY(-1px);
    }

    .lifeline-btn.quit-btn {
      border-color: #ef4444;
      background: radial-gradient(circle, #7f1d1d 0%, #360707 100%);
      color: #fca5a5;
    }

    .lifeline-btn.quit-btn:hover {
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
    }

    .lifeline-btn.used {
      opacity: 0.3;
      border-color: #555;
      color: #888;
      cursor: not-allowed;
    }

    .timer-container {
      width: 100%;
      display: none;
      margin: 4px 0;
    }

    .timer-display {
      text-align: center;
      font-size: 0.9rem;
      font-weight: bold;
      color: #fef08a;
      margin-bottom: 4px;
    }

    .timer-bar-bg {
      width: 100%;
      height: 8px;
      background: #0b0118;
      border-radius: 4px;
      border: 1px solid #38bdf8;
      overflow: hidden;
    }

    .timer-bar-fill {
      height: 100%;
      background: #22c55e;
      width: 100%;
      transition: width 1s linear, background-color 0.3s;
    }

    .prize-display {
      text-align: center;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.2), transparent);
      padding: 4px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffd700;
    }

    .question-box {
      background: linear-gradient(180deg, #1f0842 0%, #0b0118 100%);
      border: 2px solid #d4af37;
      border-radius: 16px;
      padding: 16px;
      margin: 8px 0;
      text-align: center;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 15px rgba(212, 175, 55, 0.2);
      position: relative;
    }

    .lang-en {
      font-size: 1.15rem;
      color: #ffffff;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .lang-hi {
      font-size: 1.1rem;
      color: #fef08a;
      font-weight: 500;
    }

    /* Bulb Icon Button for Explanation */
    .bulb-btn {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(255, 215, 0, 0.2);
      border: 1px solid #ffd700;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 1rem;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.3;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.2s, box-shadow 0.2s;
      z-index: 10;
    }

    .bulb-btn.active-bulb {
      opacity: 1;
      pointer-events: auto;
      animation: bulbPulse 1.5s infinite alternate;
    }

    .bulb-btn.active-bulb:hover {
      transform: scale(1.15);
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.8);
    }

    @keyframes bulbPulse {
      from { box-shadow: 0 0 4px #ffd700; }
      to { box-shadow: 0 0 16px #ffd700; }
    }

    .options-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 8px;
    }

    @media (max-width: 600px) {
      .options-container { grid-template-columns: 1fr; }
    }

    .option-btn {
      background: linear-gradient(180deg, #180533 0%, #080114 100%);
      border: 2px solid #5d33a8;
      border-radius: 20px;
      padding: 10px 14px;
      color: #ffffff;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .option-btn .opt-en {
      display: block;
      font-size: 0.95rem;
      color: #ffffff;
    }

    .option-btn .opt-hi {
      display: block;
      font-size: 0.9rem;
      color: #fef08a;
      margin-top: 2px;
    }

    .option-btn.selected {
      border-color: #ff9900 !important;
      background: linear-gradient(180deg, #cc7a00 0%, #663d00 100%) !important;
    }

    .option-btn.correct {
      border-color: #00ff66 !important;
      background: linear-gradient(180deg, #009933 0%, #003311 100%) !important;
      box-shadow: 0 0 15px #00ff66;
    }

    .option-btn.incorrect {
      border-color: #ff3333 !important;
      background: linear-gradient(180deg, #990000 0%, #330000 100%) !important;
    }

    .option-prefix {
      color: #ffd700;
      font-weight: bold;
      margin-right: 6px;
    }

    /* Media Popup Styling */
    .media-container {
      margin: 10px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-height: 220px;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
    }

    .media-instruction {
      font-size: 0.8rem;
      color: #38bdf8;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .media-container img, .media-container video {
      max-width: 100%;
      max-height: 210px;
      object-fit: contain;
    }

    .media-container audio {
      width: 100%;
      margin: 10px 0;
    }

    .end-screen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      background: rgba(15, 2, 32, 0.95);
      border: 2px solid #d4af37;
      border-radius: 20px;
      padding: 30px 20px;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(212, 175, 55, 0.4);
      z-index: 500;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 1001;
      padding: 15px;
    }

    .modal-content {
      background: #180533;
      border: 2px solid #d4af37;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      width: 100%;
      max-width: 450px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-content h3 {
      font-size: 1.1rem;
    }

    .modal-content a {
      color: #38bdf8;
      text-decoration: underline;
    }

    .modal-content a:visited {
      color: #a855f7;
    }

    .poll-bars {
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      height: 140px;
      margin: 15px 0;
      border-bottom: 2px solid #38bdf8;
      padding-bottom: 5px;
      background: rgba(11, 1, 24, 0.6);
      border-radius: 8px 8px 0 0;
      padding-top: 10px;
    }

    .poll-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      width: 20%;
    }

    .poll-bar {
      width: 100%;
      max-width: 35px;
      background: linear-gradient(180deg, #ffd700 0%, #b8860b 100%);
      border: 1px solid #ffe87c;
      border-radius: 4px 4px 0 0;
      height: 0%;
      transition: height 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
    }

    .close-btn {
      background: #ffd700;
      color: #000;
      border: none;
      padding: 6px 16px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .modal-btn-group {
      display: flex;
      gap: 10px;
      justify-
