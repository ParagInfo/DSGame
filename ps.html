<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaun Banega Dharm Shiromani (कौन बनेगा धर्म शिरोमणि)</title>
  
  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Optional Excel parameters reader if present -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #1f2833;
      --accent-gold: #f39c12;
      --accent-blue: #45a29e;
      --text-light: #edf5e1;
      --danger: #e74c3c;
      --success: #2ecc71;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-light);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin: 20px 0;
    }

    h1 {
      color: var(--accent-gold);
      margin: 0;
    }

    .container {
      width: 90%;
      max-width: 900px;
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
    }

    /* Lifelines Bar */
    .lifelines-bar {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px;
      border-radius: 8px;
    }

    .lifeline-btn {
      background-color: var(--accent-blue);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .lifeline-btn:disabled {
      background-color: #555;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .lifeline-btn.quit {
      background-color: var(--danger);
    }

    /* Info Panel */
    .info-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 1.1em;
    }

    .timer {
      font-weight: bold;
      color: var(--accent-gold);
      font-size: 1.3em;
    }

    /* Question & Media Container */
    .question-box {
      background: rgba(0, 0, 0, 0.2);
      border: 2px solid var(--accent-gold);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
      min-height: 120px;
    }

    .media-container {
      margin-bottom: 15px;
    }

    .media-container img, .media-container video {
      max-width: 100%;
      max-height: 250px;
      border-radius: 6px;
    }

    /* Options Grid */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--accent-blue);
      color: var(--text-light);
      padding: 15px;
      border-radius: 6px;
      text-align: left;
      font-size: 1em;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover:not(:disabled) {
      background: var(--accent-blue);
      color: black;
    }

    .option-btn.correct {
      background-color: var(--success) !important;
      color: white;
    }

    .option-btn.incorrect {
      background-color: var(--danger) !important;
      color: white;
    }

    .option-btn.hidden-option {
      visibility: hidden;
    }

    /* Audience Poll Overlay */
    .poll-container {
      margin-top: 15px;
      display: none;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px;
      border-radius: 6px;
    }

    .poll-bar {
      height: 15px;
      background-color: var(--accent-gold);
      border-radius: 3px;
      margin-top: 5px;
    }

    /* Controls & Explanation */
    .controls {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .explanation-box {
      margin-top: 15px;
      padding: 10px;
      background: rgba(243, 156, 18, 0.1);
      border-left: 4px solid var(--accent-gold);
      display: none;
    }

    /* Ladder */
    .ladder-status {
      text-align: right;
      color: var(--accent-gold);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>Kaun Banega Dharm Shiromani</h1>
    <p>कौन बनेगा धर्म शिरोमणि</p>
  </header>

  <div class="container">
    <!-- Lifelines -->
    <div class="lifelines-bar">
      <button id="btn-5050" class="lifeline-btn" onclick="use5050()">50:50</button>
      <button id="btn-audience" class="lifeline-btn" onclick="useAudiencePoll()">Audience Poll</button>
      <button id="btn-flip" class="lifeline-btn" onclick="useFlipQuestion()">Flip Question</button>
      <button id="btn-quit" class="lifeline-btn quit" onclick="quitGame()">Quit Game</button>
    </div>

    <!-- Info Panel -->
    <div class="info-panel">
      <div>Question <span id="q-num">1</span> / 15</div>
      <div class="timer" id="timer-display">30s</div>
      <div class="ladder-status">Points: <span id="current-points">0</span></div>
    </div>

    <!-- Question Container -->
    <div class="question-box">
      <div id="media-area" class="media-container"></div>
      <div id="question-text">Loading question...</div>
    </div>

    <!-- Options Grid -->
    <div class="options-grid" id="options-container">
      <button class="option-btn" id="opt-A" onclick="selectAnswer('A')">A: </button>
      <button class="option-btn" id="opt-B" onclick="selectAnswer('B')">B: </button>
      <button class="option-btn" id="opt-C" onclick="selectAnswer('C')">C: </button>
      <button class="option-btn" id="opt-D" onclick="selectAnswer('D')">D: </button>
    </div>

    <!-- Audience Poll Visualizer -->
    <div id="poll-area" class="poll-container"></div>

    <!-- Explanation Box -->
    <div id="explanation-area" class="explanation-box"></div>

    <!-- Controls -->
    <div class="controls">
      <button class="lifeline-btn" id="next-btn" style="display: none;" onclick="nextQuestion()">Next Question</button>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. SUPABASE CONFIGURATION
    // ==========================================
    const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT_ID.supabase.co'; 
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';                   
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ==========================================
    // 2. GAME STATE & POINT LADDER
    // ==========================================
    const LADDER = [
      1000, 2000, 3000, 5000, 10000, 
      20000, 40000, 80000, 160000, 320000, 
      640000, 1250000, 2500000, 5000000, 70000000
    ];

    let currentLevel = 1;
    let activeQuestion = null;
    let shuffledOptions = [];
    let correctOptionKey = '';
    let timerInterval = null;
    let timeRemaining = 30;
    let timedMode = true;
    let languageFlag = 'E'; // 'E' for English, 'H' for Hindi

    // URL Debug parameter overrides
    const urlParams = new URLSearchParams(window.location.search);
    const debugMode = urlParams.get('debug') === 'true';
    const specificQId = urlParams.get('question');

    // ==========================================
    // 3. DIRECT SINGLE-ROW SUPABASE FETCH
    // ==========================================
    async function fetchRandomQuestion(level, flag = 'E') {
      try {
        // If debug parameters request a specific Question ID
        if (debugMode && specificQId) {
          const { data, error } = await supabaseClient
            .from('QuestionsBank')
            .select('*')
            .eq('Number', specificQId)
            .limit(1);
          if (error) throw error;
          return data[0] || null;
        }

        // Call the PostgreSQL random order RPC function for optimal speed
        const { data, error } = await supabaseClient.rpc('get_random_question', {
          target_level: level,
          target_flag: flag
        });

        if (error) {
          // Fallback direct SQL query if RPC is not created in Supabase
          const { data: fallbackData, error: fallbackError } = await supabaseClient
            .from('QuestionsBank')
            .select('*')
            .eq('Level', level)
            .eq('HEFlag', flag)
            .limit(10); // Fetch small batch to select 1 randomly client-side

          if (fallbackError) throw fallbackError;
          if (fallbackData && fallbackData.length > 0) {
            const randomIndex = Math.floor(Math.random() * fallbackData.length);
            return fallbackData[randomIndex];
          }
          return null;
        }

        return data && data.length > 0 ? data[0] : null;

      } catch (err) {
        console.error('Error fetching question from Supabase:', err.message);
        return null;
      }
    }

    // ==========================================
    // 4. QUESTION RENDERING & GAME LOGIC
    // ==========================================
    async function loadCurrentLevel() {
      resetTurnUI();
      document.getElementById('q-num').innerText = currentLevel;
      document.getElementById('question-text').innerText = "Fetching question from database...";

      const row = await fetchRandomQuestion(currentLevel, languageFlag);

      if (!row) {
        document.getElementById('question-text').innerText = "Failed to load question or no question found for this level.";
        return;
      }

      activeQuestion = row;
      displayQuestion(row);
      startTimer();
    }

    function displayQuestion(q) {
      document.getElementById('question-text').innerText = q.Question;

      // Render Media based on Qtype
      const mediaArea = document.getElementById('media-area');
      mediaArea.innerHTML = '';
      
      if (q.Qtype === 'P' && q.URL) {
        mediaArea.innerHTML = `<img src="${q.URL}" alt="Question Image">`;
      } else if (q.Qtype === 'A' && q.URL) {
        mediaArea.innerHTML = `<audio controls autoplay src="${q.URL}"></audio>`;
      } else if (q.Qtype === 'V' && q.URL) {
        mediaArea.innerHTML = `<video controls autoplay height="200" src="${q.URL}"></video>`;
      }

      // Prepare options. 'A' is the correct answer choice in schema.
      const rawOptions = [
        { key: 'A', text: q.A, isCorrect: true },
        { key: 'B', text: q.B, isCorrect: false },
        { key: 'C', text: q.C, isCorrect: false },
        { key: 'D', text: q.D, isCorrect: false }
      ];

      // Shuffle options randomly
      shuffledOptions = rawOptions.sort(() => Math.random() - 0.5);

      const keys = ['A', 'B', 'C', 'D'];
      keys.forEach((label, idx) => {
        const btn = document.getElementById(`opt-${label}`);
        btn.innerText = `${label}: ${shuffledOptions[idx].text}`;
        btn.dataset.originalKey = shuffledOptions[idx].key;
        btn.disabled = false;
        btn.className = 'option-btn';

        if (shuffledOptions[idx].isCorrect) {
          correctOptionKey = label;
        }
      });
    }

    function selectAnswer(selectedLabel) {
      stopTimer();
      disableAllOptions();

      const selectedBtn = document.getElementById(`opt-${selectedLabel}`);
      const correctBtn = document.getElementById(`opt-${correctOptionKey}`);

      if (selectedLabel === correctOptionKey) {
        selectedBtn.classList.add('correct');
        const wonPoints = LADDER[currentLevel - 1];
        document.getElementById('current-points').innerText = wonPoints.toLocaleString();

        if (currentLevel === 15) {
          document.getElementById('question-text').innerText += " 🎉 Congratulations! You are the Dharm Shiromani!";
        } else {
          document.getElementById('next-btn').style.display = 'inline-block';
        }
      } else {
        selectedBtn.classList.add('incorrect');
        correctBtn.classList.add('correct');
        document.getElementById('question-text').innerText += " ❌ Incorrect Answer. Game Over!";
      }

      // Render Explanation if available
      if (activeQuestion.Explanation) {
        const expArea = document.getElementById('explanation-area');
        expArea.innerHTML = `<strong>Explanation:</strong> ${activeQuestion.Explanation}`;
        expArea.style.display = 'block';
      }
    }

    function nextQuestion() {
      if (currentLevel < 15) {
        currentLevel++;
        loadCurrentLevel();
      }
    }

    // ==========================================
    // 5. TIMERS & LIFELINES
    // ==========================================
    function startTimer() {
      stopTimer();
      if (!timedMode) {
        document.getElementById('timer-display').innerText = 'Untimed';
        return;
      }

      timeRemaining = 30;
      document.getElementById('timer-display').innerText = `${timeRemaining}s`;

      timerInterval = setInterval(() => {
        timeRemaining--;
        document.getElementById('timer-display').innerText = `${timeRemaining}s`;

        if (timeRemaining <= 0) {
          stopTimer();
          disableAllOptions();
          document.getElementById(`opt-${correctOptionKey}`).classList.add('correct');
          document.getElementById('question-text').innerText += " ⏰ Time's Up! Game Over!";
        }
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
    }

    function use5050() {
      document.getElementById('btn-5050').disabled = true;
      const keys = ['A', 'B', 'C', 'D'];
      const incorrectKeys = keys.filter(k => k !== correctOptionKey);

      // Randomly hide 2 incorrect options
      const toHide = incorrectKeys.sort(() => Math.random() - 0.5).slice(0, 2);
      toHide.forEach(k => {
        document.getElementById(`opt-${k}`).classList.add('hidden-option');
      });
    }

    function useAudiencePoll() {
      document.getElementById('btn-audience').disabled = true;
      const pollArea = document.getElementById('poll-area');
      pollArea.style.display = 'block';

      const keys = ['A', 'B', 'C', 'D'];
      let correctPct = Math.floor(Math.random() * 30) + 50; // Give correct choice 50-80%
      let remainingPct = 100 - correctPct;

      let html = '<strong>Audience Poll Results:</strong><br>';
      keys.forEach(k => {
        let pct = 0;
        if (k === correctOptionKey) {
          pct = correctPct;
        } else {
          pct = Math.floor(Math.random() * remainingPct);
          remainingPct -= pct;
        }
        html += `
          <div style="margin-top:5px;">
            ${k}: ${pct}%
            <div class="poll-bar" style="width: ${pct}%;"></div>
          </div>`;
      });

      pollArea.innerHTML = html;
    }

    async function useFlipQuestion() {
      document.getElementById('btn-flip').disabled = true;
      await loadCurrentLevel();
    }

    function quitGame() {
      stopTimer();
      disableAllOptions();
      document.getElementById('btn-quit').disabled = true;
      const points = currentLevel > 1 ? LADDER[currentLevel - 2] : 0;
      document.getElementById('question-text').innerText = `You chose to quit. You walked away with ${points.toLocaleString()} points!`;
    }

    function disableAllOptions() {
      const keys = ['A', 'B', 'C', 'D'];
      keys.forEach(k => {
        document.getElementById(`opt-${k}`).disabled = true;
      });
    }

    function resetTurnUI() {
      document.getElementById('next-btn').style.display = 'none';
      document.getElementById('explanation-area').style.display = 'none';
      document.getElementById('poll-area').style.display = 'none';
      document.getElementById('poll-area').innerHTML = '';

      const keys = ['A', 'B', 'C', 'D'];
      keys.forEach(k => {
        const btn = document.getElementById(`opt-${k}`);
        btn.className = 'option-btn';
        btn.disabled = false;
      });
    }

    // ==========================================
    // 6. INITIALIZATION
    // ==========================================
    window.onload = function() {
      loadCurrentLevel();
    };
  </script>
</body>
</html>
